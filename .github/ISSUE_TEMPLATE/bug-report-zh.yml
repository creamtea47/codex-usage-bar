name: 问题反馈（简体中文）
description: 反馈 CodexUsageBar 的可复现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先使用应用内“复制脱敏诊断”并逐项检查内容。

        **严禁提交 `auth.json`、Token、账号/邮箱、代理地址、未检查的日志或原始接口响应。**
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已检查的脱敏诊断（可选）
      description: 仅粘贴应用内生成且由你亲自检查过的脱敏摘要；不要粘贴日志。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交 auth.json、Token、账号/邮箱、代理、未检查日志或原始响应。
          required: true
